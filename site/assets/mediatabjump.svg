<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI Variable Display, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- MOCKUP: illustration of Media Tab Jump. Swap for a real screenshot (same 1200x640 size) when one exists. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fde2e4"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.35" stop-color="#ffb84d"/>
      <stop offset="0.7" stop-color="#5ad1ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7c2d12" flood-opacity="0.22"/></filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="c"><rect width="1200" height="640" rx="28"/></clipPath>
    <clipPath id="page"><rect x="0" y="0" width="620" height="440" rx="14"/></clipPath>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="640" fill="url(#bg)"/>
    <circle cx="1080" cy="90" r="220" fill="#ffd6a5" opacity="0.5"/>
    <circle cx="120" cy="600" r="240" fill="#ffc8dd" opacity="0.5"/>

    <!-- browser window -->
    <g transform="translate(60 80)" filter="url(#sh)">
      <rect width="620" height="440" rx="14" fill="#ffffff"/>
      <g clip-path="url(#page)">
        <rect width="620" height="52" fill="#f3f4f6"/>
        <circle cx="22" cy="26" r="6" fill="#f87171"/><circle cx="42" cy="26" r="6" fill="#fbbf24"/><circle cx="62" cy="26" r="6" fill="#34d399"/>
        <!-- tabs -->
        <rect x="88" y="12" width="130" height="40" rx="9" fill="#e5e7eb"/>
        <text x="104" y="37" fill="#6b7280" font-size="13">Inbox (3)</text>
        <rect x="224" y="12" width="130" height="40" rx="9" fill="#e5e7eb"/>
        <text x="240" y="37" fill="#6b7280" font-size="13">Recipes</text>
        <rect x="360" y="8" width="170" height="44" rx="10" fill="#ffffff"/>
        <path d="M376 26 v12 l10 -6 z" fill="#e11d48"/>
        <text x="394" y="37" fill="#111827" font-size="13" font-weight="650">Lo-fi beats</text>
        <!-- speaker badge -->
        <path d="M496 28 h4 l5 -4 v14 l-5 -4 h-4 z" fill="#e11d48"/>
        <rect x="536" y="12" width="70" height="40" rx="9" fill="#e5e7eb"/>
        <text x="552" y="37" fill="#6b7280" font-size="13">Docs</text>
        <!-- page -->
        <rect x="0" y="52" width="620" height="388" fill="#ffffff"/>
        <rect x="24" y="72" width="572" height="270" rx="12" fill="url(#vid)"/>
        <circle cx="310" cy="207" r="34" fill="#fff" fill-opacity="0.9"/>
        <rect x="298" y="191" width="8" height="32" rx="2" fill="#e11d48"/>
        <rect x="314" y="191" width="8" height="32" rx="2" fill="#e11d48"/>
        <rect x="24" y="360" width="300" height="16" rx="8" fill="#111827" opacity="0.85"/>
        <rect x="24" y="388" width="200" height="12" rx="6" fill="#9ca3af"/>
      </g>
      <!-- "you are here" ring around the active tab -->
      <rect x="354" y="2" width="182" height="56" rx="14" fill="none" stroke="#10b981" stroke-width="4"/>
      <g transform="translate(398 -40)">
        <rect width="100" height="30" rx="15" fill="#10b981"/>
        <text x="50" y="20" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">You're here!</text>
      </g>
    </g>

    <!-- volume flyout with glowing media card -->
    <g transform="translate(760 150)">
      <rect x="-14" y="-14" width="408" height="148" rx="30" fill="url(#aurora)" filter="url(#blur)" opacity="0.95"/>
      <g filter="url(#sh)">
        <rect width="380" height="320" rx="18" fill="#fbfbfd"/>
      </g>
      <rect width="380" height="120" rx="18" fill="#ffffff" stroke="url(#aurora)" stroke-width="3"/>
      <rect x="18" y="18" width="84" height="84" rx="12" fill="url(#art)"/>
      <path d="M50 46 v28 l22 -14 z" fill="#fff"/>
      <text x="118" y="44" fill="#6b7280" font-size="13">Microsoft Edge</text>
      <text x="118" y="68" fill="#111827" font-size="18" font-weight="700">Lo-fi beats to code</text>
      <g transform="translate(118 82)" fill="#374151">
        <path d="M4 4 v16 M20 4 l-12 8 l12 8 z" stroke="#374151" stroke-width="2.5"/>
        <rect x="44" y="3" width="6" height="18" rx="1.5"/><rect x="56" y="3" width="6" height="18" rx="1.5"/>
        <path d="M90 4 l12 8 l-12 8 z M106 4 v16" stroke="#374151" stroke-width="2.5"/>
      </g>
      <!-- pointer clicking the card -->
      <path d="M336 50 l0 44 l11 -10 l8 19 l9 -4 l-8 -18 l15 -1 z" fill="#111827" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="336" cy="50" r="16" fill="none" stroke="#111827" stroke-width="2" opacity="0.35"/>
      <circle cx="336" cy="50" r="26" fill="none" stroke="#111827" stroke-width="2" opacity="0.15"/>
      <!-- rest of flyout -->
      <g transform="translate(18 146)">
        <rect width="104" height="64" rx="10" fill="#3d7bff"/>
        <rect x="118" width="104" height="64" rx="10" fill="#e5e7eb"/>
        <rect x="236" width="108" height="64" rx="10" fill="#3d7bff"/>
        <text x="52" y="38" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Wi-Fi</text>
        <text x="170" y="38" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">Bluetooth</text>
        <text x="290" y="38" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Focus</text>
        <rect y="96" width="344" height="6" rx="3" fill="#e5e7eb"/>
        <rect y="96" width="220" height="6" rx="3" fill="#3d7bff"/>
        <circle cx="220" cy="99" r="10" fill="#fff" stroke="#d1d5db"/>
        <rect y="134" width="344" height="6" rx="3" fill="#e5e7eb"/>
        <rect y="134" width="150" height="6" rx="3" fill="#3d7bff"/>
        <circle cx="150" cy="137" r="10" fill="#fff" stroke="#d1d5db"/>
      </g>
    </g>

    <!-- swoosh arrow from card to tab -->
    <path d="M770 140 C 720 40, 600 30, 560 62" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ah)"/>
    <text x="736" y="58" fill="#1f2937" font-size="17" font-weight="700" transform="rotate(-8 736 58)">one click</text>

    <text x="60" y="580" fill="#9a3412" font-size="15" font-weight="700" letter-spacing="2" opacity="0.7">MEDIA TAB JUMP</text>
  </g>
</svg>
