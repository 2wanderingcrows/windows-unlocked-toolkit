<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI Variable Display, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- MOCKUP: concept art of the toolkit tray panel. Swap for a real screenshot (same 1200x680 size) once the tray app ships. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#1b2f6e"/>
      <stop offset="1" stop-color="#3a1f5e"/>
    </linearGradient>
    <radialGradient id="bloom1" cx="0.32" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3b5bdb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f4f6fb" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.5" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#5ad1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="mode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#22183f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="1200" height="680" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1200" height="680" fill="url(#wall)"/>
    <ellipse cx="380" cy="440" rx="520" ry="300" fill="url(#bloom1)"/>
    <ellipse cx="980" cy="120" rx="360" ry="240" fill="url(#bloom2)"/>
    <!-- abstract wallpaper ribbons -->
    <path d="M-40 520 C 220 380, 420 640, 700 470 S 1100 360, 1260 430" stroke="#9cc0ff" stroke-opacity="0.25" stroke-width="2" fill="none"/>
    <path d="M-40 560 C 240 420, 440 680, 720 510 S 1120 400, 1260 470" stroke="#d6b8ff" stroke-opacity="0.2" stroke-width="2" fill="none"/>

    <!-- headline on the desktop -->
    <text x="72" y="150" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1">Your PC, with the</text>
    <text x="72" y="214" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1">little things fixed.</text>
    <text x="74" y="262" fill="#c9d6ff" font-size="22">Small tools. One tray icon. Zero nonsense.</text>

    <!-- floating sticker chips -->
    <g transform="translate(74 300)">
      <rect width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="75" y="26" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Open source</text>
    </g>
    <g transform="translate(236 300)">
      <rect width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="66" y="26" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">No tracking</text>
    </g>
    <g transform="translate(380 300)">
      <rect width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="75" y="26" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Free forever</text>
    </g>

    <!-- tray panel: matches the tray flyout design mockup (accent #3b6cf6) -->
    <g transform="translate(712 66) scale(1.2)" filter="url(#shadow)">
      <rect width="352" height="452" rx="12" fill="#fafafc" fill-opacity="0.97" stroke="#ffffff" stroke-opacity="0.6"/>
      <!-- header -->
      <rect x="16" y="14" width="22" height="22" rx="6" fill="#3b6cf6"/>
      <g transform="translate(20.5 18.5) scale(0.54)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></g>
      <text x="48" y="30" fill="#1b1b21" font-size="14" font-weight="600">Unlocked Toolkit</text>
      <g transform="translate(316 16) scale(0.75)" fill="none" stroke="#3b3b45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.4"/></g>
      <!-- mode card -->
      <rect x="12" y="48" width="328" height="112" rx="12" fill="url(#mode)"/>
      <g transform="translate(28 64)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11a4 4 0 0 1 3.9 4.9l-1 4.3a2.3 2.3 0 0 1-4 .9L14.8 16H9.2l-1.6 2.1a2.3 2.3 0 0 1-4-.9l-1-4.3A4 4 0 0 1 6.5 8z"/><path d="M7.5 11v3M6 12.5h3"/></g>
      <text x="60" y="76" fill="#fff" font-size="15" font-weight="600">TV mode</text>
      <text x="60" y="94" fill="#fff" fill-opacity="0.85" font-size="13">Your controller is on</text>
      <rect x="28" y="108" width="296" height="40" rx="10" fill="#fff" fill-opacity="0.18"/>
      <text x="176" y="133" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Back to desktop</text>
      <!-- tiles -->
        <g transform="translate(12 172)">
          <rect width="160" height="76" rx="10" fill="#3b6cf6"/>
          <text x="12" y="27" fill="#fff" font-size="14" font-weight="600">Leanback Mode</text>
          <text x="12" y="62" fill="#fff" fill-opacity="0.85" font-size="13">Follows controller</text>
        </g>
        <g transform="translate(180 172)">
          <rect width="160" height="76" rx="10" fill="#3b6cf6"/>
          <text x="12" y="27" fill="#fff" font-size="14" font-weight="600">Controller mouse</text>
          <text x="12" y="62" fill="#fff" fill-opacity="0.85" font-size="13">Left stick moves</text>
        </g>
        <g transform="translate(12 256)">
          <rect width="160" height="76" rx="10" fill="#3b6cf6"/>
          <text x="12" y="27" fill="#fff" font-size="14" font-weight="600">Media Tab Jump</text>
          <text x="12" y="62" fill="#fff" fill-opacity="0.85" font-size="13">Edge, Chrome, Brave</text>
        </g>
        <g transform="translate(180 256)">
          <rect width="160" height="76" rx="10" fill="#3b6cf6"/>
          <text x="12" y="27" fill="#fff" font-size="14" font-weight="600">Hover glow</text>
          <text x="12" y="62" fill="#fff" fill-opacity="0.85" font-size="13">Color shift</text>
        </g>

      <!-- menu rows -->
      <rect x="0" y="344" width="352" height="1" fill="#e6e6ec"/>
      <g transform="translate(18 362) scale(0.67)" fill="none" stroke="#1b1b21" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></g>
      <text x="44" y="375" fill="#1b1b21" font-size="14">Pause everything for 1 hour</text>
      <g transform="translate(18 406) scale(0.67)" fill="none" stroke="#1b1b21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></g>
      <text x="44" y="419" fill="#1b1b21" font-size="14">Open settings</text>
    </g>

    <!-- taskbar -->
    <rect x="0" y="628" width="1200" height="52" fill="#0b1224" fill-opacity="0.72"/>
    <g fill="#ffffff" fill-opacity="0.85">
      <rect x="548" y="642" width="24" height="24" rx="5" fill="#4f8cff"/>
      <rect x="584" y="642" width="24" height="24" rx="5" fill-opacity="0.3"/>
      <rect x="620" y="642" width="24" height="24" rx="5" fill-opacity="0.3"/>
    </g>
    <!-- tray icon highlighted -->
    <rect x="1018" y="638" width="34" height="32" rx="7" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="1024" y="643" width="22" height="22" rx="6" fill="#3b6cf6"/>
    <rect x="1029" y="653" width="12" height="8" rx="2" fill="#fff"/>
    <path d="M1031.5 653 v-3 a3.5 3.5 0 0 1 7 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" transform="rotate(-18 1035 653)"/>
    <text x="1140" y="652" text-anchor="end" fill="#ffffff" font-size="12">9:41 PM</text>
    <text x="1140" y="668" text-anchor="end" fill="#c7d2fe" font-size="11">Saturday</text>
    <path d="M1035 632 l0 -18" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 4"/>
  </g>
</svg>
