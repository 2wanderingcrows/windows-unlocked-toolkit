name: Build installer and website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build installer and website
        run: python scripts/build.py

      - name: Check every PowerShell file parses
        shell: pwsh
        run: |
          $bad = 0
          $files = Get-ChildItem -Path tools, dist, scripts -Recurse -Filter *.ps1
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" } }
            else { Write-Host "OK  $($f.FullName)" }
          }
          # The .cmd runs the part of itself after the marker; check that part too.
          $t = [IO.File]::ReadAllText("dist/WindowsUnlockedToolkit.cmd")
          $ps = $t.Substring($t.IndexOf('##WUT-POWERSHELL-BELOW##'))
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($ps, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "::error::cmd payload: $($_.Message)" } }
          else { Write-Host "OK  dist/WindowsUnlockedToolkit.cmd (PowerShell part)" }
          if ($bad) { exit 1 }

      - name: Keep the built files with this run (for testing a pull request)
        uses: actions/upload-artifact@v4
        with:
          name: windows-unlocked-toolkit
          path: dist/

  compile:
    # Builds every tool's C# with the same compiler a user's PC has (.NET Framework 4.x csc, C# 5).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile each tool with the C# compiler built into Windows
        shell: powershell
        run: |
          $fw = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $csc = Join-Path $fw 'csc.exe'
          $wpf = Join-Path $fw 'WPF'
          $out = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bad = 0
          foreach ($cs in Get-ChildItem -Path tools -Recurse -Filter *.cs) {
            $exe = Join-Path $out ($cs.BaseName + '.exe')
            # Same references the tools' installers use. .xaml files next to the .cs are embedded (the tray app's layouts).
            $cscArgs = @('/nologo', '/target:winexe', "/lib:$wpf", '/r:System.Windows.Forms.dll', '/r:System.Drawing.dll',
                         '/r:PresentationFramework.dll', '/r:PresentationCore.dll', '/r:WindowsBase.dll', '/r:System.Xaml.dll', '/r:System.Xml.dll')
            foreach ($x in Get-ChildItem -Path $cs.DirectoryName -Filter *.xaml) { $cscArgs += "/resource:$($x.FullName),$($x.Name)" }
            $cscArgs += "/out:$exe"
            $cscArgs += $cs.FullName
            $log = & $csc @cscArgs 2>&1
            if ($LASTEXITCODE -ne 0) {
              $bad++
              $log | Where-Object { $_ -match 'error' } | ForEach-Object { Write-Host "::error file=$($cs.FullName)::$_" }
            }
            else { Write-Host "OK  $($cs.FullName)" }
          }
          if ($bad) { exit 1 }

      - name: Render the tray app's pages with sample data (fails on layout or binding errors)
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'bin\WindowsUnlockedToolkit.exe'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $layout = (Resolve-Path 'tools\leanback\controller-mouse.amgp').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', "`"$shots`"", "`"$layout`"" -Wait -PassThru
          Get-Content (Join-Path $shots 'selftest.txt') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::tray app self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Check Leanback Mode finds the controller layer in the layouts
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'bin\LeanbackMode.exe'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $bad = 0
          $cases = @(@((Resolve-Path 'tools\leanback\controller-mouse.amgp').Path, 'LT'), @((Join-Path $shots 'layout-roundtrip.amgp'), 'RB'))
          foreach ($c in $cases) {
            $out = Join-Path $env:RUNNER_TEMP 'layer-test.txt'
            Start-Process -FilePath $exe -ArgumentList '--layer-test', "`"$($c[0])`"", "`"$out`"", 'Space', 'Ctrl+Shift+T', 'BrowserBack' -Wait
            $text = Get-Content $out -Raw
            Write-Host $text
            if ($text -notmatch "layer=$($c[1])") { Write-Host "::error::expected layer=$($c[1]) for $($c[0])"; $bad++ }
            if ($text -notmatch 'tap Ctrl\+Shift\+T=LControlKey,LShiftKey,T') { Write-Host '::error::LayerTap combos not read as expected'; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Keep the screenshots with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-app-screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore

  setup:
    # Builds WindowsUnlockedToolkitSetup.exe (the installer with buttons) around the installer the build job made.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-unlocked-toolkit
          path: dist/

      - name: Build the setup app and render its screens (fails on layout or binding errors)
        shell: powershell
        run: ./scripts/build-setup.ps1 -SelfTest (Join-Path $env:RUNNER_TEMP 'setup-screens')

      - name: Keep the unsigned setup app
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: dist/WindowsUnlockedToolkitSetup.exe

      # Code signing through SignPath Foundation (see CODE_SIGNING_POLICY.md). Runs on pushes to main once
      # the repository has the SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret. Each request
      # waits for an approver to approve it in SignPath. Without them the setup app stays unsigned.
      - name: Sign the setup app (SignPath)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'windows-unlocked-toolkit' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Use the signed copy if there is one
        shell: powershell
        run: |
          $signed = Get-ChildItem -Path dist/signed -Recurse -Filter WindowsUnlockedToolkitSetup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signed) { Copy-Item $signed.FullName dist/WindowsUnlockedToolkitSetup.exe -Force; Write-Host 'Using the signed setup app' }
          else { Write-Host 'Setup app is unsigned' }

      - name: Keep the setup app with this run
        uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/WindowsUnlockedToolkitSetup.exe

      - name: Keep the screenshots with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-screenshots
          path: ${{ runner.temp }}/setup-screens/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, compile, setup]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-unlocked-toolkit
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: dist/

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    # A GitHub Release with the setup app, whenever a tool's version changes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, compile, setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-unlocked-toolkit
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: dist/

      - name: Publish a release if any tool's version changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tr -d '\r' < dist/manifest.ini > manifest.txt
          versions=$(grep -E '^[a-z0-9]+\.version=' manifest.txt | sort)
          fp=$(printf '%s' "$versions" | sha256sum | cut -c1-12)
          latest=$(gh release view --json body -q .body 2>/dev/null || true)
          if printf '%s' "$latest" | grep -q "versions-fingerprint: $fp"; then
            echo "No tool versions changed since the latest release; nothing to publish."
            exit 0
          fi
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          {
            echo "Download **WindowsUnlockedToolkitSetup.exe** below and open it. Pick your tools and press Install."
            echo
            echo "| Tool | Version |"
            echo "| --- | --- |"
            grep -E '^[a-z0-9]+\.name=' manifest.txt | while IFS='=' read -r key name; do
              id=${key%.name}
              ver=$(grep -E "^${id}\.version=" manifest.txt | cut -d= -f2-)
              echo "| $name | $ver |"
            done
            echo
            echo "Already have the toolkit? The tray app installs this update by itself (Updates and about > Update automatically)."
            echo
            echo "The setup app isn't code-signed yet, so Windows SmartScreen may say it \"protected your PC\". Choose **More info > Run anyway**. Everything it installs is the source code in this repository, built on your PC."
            echo
            echo "<!-- versions-fingerprint: $fp -->"
          } > notes.md
          gh release create "$tag" dist/WindowsUnlockedToolkitSetup.exe dist/install.ps1 dist/WindowsUnlockedToolkit.cmd \
            --title "Windows Unlocked Toolkit $(date -u +%Y-%m-%d)" --notes-file notes.md --target "$GITHUB_SHA"
